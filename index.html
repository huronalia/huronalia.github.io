<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Huronalia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            width: max(100px, 10vw);
            height: auto;
        }
        .company-name {
            position: fixed;
            top: 24px;
            left: 28px;
            font-family: 'Averia Libre', sans-serif;
            font-size: 1.2rem;
            font-weight: 400;
            color: black;
        }
        .copyright {
            position: fixed;
            bottom: 20px;
            left: 28px;
            font-family: sans-serif;
            font-size: 0.75rem;
            color: #ccc;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <!-- <span class="company-name">Huronalia</span> -->
    <img src="resources/logo.svg" alt="Huronalia">
    <span class="copyright">&copy; 2026 Huronalia Research, Inc.</span>
</body>
</html>
